{% extends "base.html" %}
{% block title %}{{ 'Edit employee' if mode=='edit' else 'Add employee' }}{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <div class="mb-6">
    <a href="{{ url_for('employees_list') }}" class="text-xs text-ink-900/50 hover:text-accent-dark inline-flex items-center gap-1 mb-3">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      Back to employees
    </a>
    <p class="font-mono-track text-[11px] uppercase tracking-widest text-ink-900/40">Workforce</p>
    <h1 class="font-display text-2xl font-semibold mt-0.5">{{ 'Edit employee' if mode=='edit' else 'Add a new employee' }}</h1>
  </div>

  <form method="POST" class="bg-white border border-line rounded-xl shadow-card p-6 sm:p-8 space-y-5">
    <div class="grid sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Full name</label>
        <input type="text" name="full_name" required value="{{ employee.full_name if employee else '' }}"
               class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Username</label>
        {% if mode == 'edit' %}
        <input type="text" value="{{ employee.username }}" disabled
               class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper/70 text-sm text-ink-900/50">
        {% else %}
        <input type="text" name="username" required
               class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition"
               placeholder="e.g. ravi_s">
        {% endif %}
      </div>
    </div>

    <div class="grid sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Email</label>
        <input type="email" name="email" value="{{ employee.email if employee else '' }}"
               class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Phone</label>
        <input type="text" name="phone" value="{{ employee.phone if employee else '' }}"
               class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
      </div>
    </div>

    <div class="grid sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Role</label>
        <select name="role" class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
          {% for r in ['Administrator','Branch Manager','Employee'] %}
          <option value="{{ r }}" {{ 'selected' if employee and employee.role==r else '' }}>{{ r }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Designation</label>
        <input type="text" name="designation" value="{{ employee.designation if employee else '' }}" placeholder="e.g. Delivery Executive"
               class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
      </div>
    </div>

    <div class="grid sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Branch</label>
        <select name="branch_id" class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
          <option value="">— Unassigned —</option>
          {% for b in branches %}
          <option value="{{ b.id }}" {{ 'selected' if employee and employee.branch_id==b.id else '' }}>{{ b.branch_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Base salary (₹/month)</label>
        <input type="number" step="0.01" name="base_salary" value="{{ employee.base_salary if employee else '' }}"
               class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
      </div>
    </div>

    <div class="grid sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">
          {{ 'New password (optional)' if mode == 'edit' else 'Password' }}
        </label>
        <input type="password" name="password" {{ 'required' if mode != 'edit' else '' }}
               class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition"
               placeholder="{{ 'Leave blank to keep current password' if mode=='edit' else '••••••••' }}">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Status</label>
        <select name="status" class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
          <option value="Active" {{ 'selected' if employee and employee.status=='Active' else '' }}>Active</option>
          <option value="Inactive" {{ 'selected' if employee and employee.status=='Inactive' else '' }}>Inactive</option>
        </select>
      </div>
    </div>

    <div class="flex items-center gap-3 pt-2">
      <button type="submit" class="bg-ink-900 hover:bg-ink-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">
        {{ 'Save changes' if mode=='edit' else 'Add employee' }}
      </button>
      <a href="{{ url_for('employees_list') }}" class="text-sm text-ink-900/50 hover:text-ink-900 px-3">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
