{% extends "base.html" %}
{% block title %}Assign delivery{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="mb-6">
    <a href="{{ url_for('deliveries_list') }}" class="text-xs text-ink-900/50 hover:text-accent-dark inline-flex items-center gap-1 mb-3">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      Back to deliveries
    </a>
    <p class="font-mono-track text-[11px] uppercase tracking-widest text-ink-900/40">Operations</p>
    <h1 class="font-display text-2xl font-semibold mt-0.5">Assign a new delivery</h1>
  </div>

  <form method="POST" class="bg-white border border-line rounded-xl shadow-card p-6 sm:p-8 space-y-5">
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Tracking number</label>
      <input type="text" name="tracking_number" required placeholder="e.g. CMS100239"
             class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition font-mono-track">
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Customer name</label>
      <input type="text" name="customer_name" required
             class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Destination address</label>
      <textarea name="destination_address" required rows="2"
                class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition"></textarea>
    </div>
    <div class="grid sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Assign to agent</label>
        <select name="assigned_to" class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
          <option value="">— Unassigned —</option>
          {% for e in employees %}
          <option value="{{ e.id }}">{{ e.full_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-ink-900/50 mb-1.5">Branch</label>
        <select name="branch_id" class="w-full px-4 py-2.5 rounded-lg border border-line bg-paper focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent text-sm transition">
          <option value="">— Unassigned —</option>
          {% for b in branches %}
          <option value="{{ b.id }}">{{ b.branch_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="flex items-center gap-3 pt-2">
      <button type="submit" class="bg-ink-900 hover:bg-ink-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition">Assign delivery</button>
      <a href="{{ url_for('deliveries_list') }}" class="text-sm text-ink-900/50 hover:text-ink-900 px-3">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
